<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPUC Cancionero</title>
<style>
:root{
  --bg:#0a1628;
  --bg2:#0f2040;
  --bg3:#162850;
  --border:#1e3a6e;
  --gold:#FFD100;
  --gold2:#FFA500;
  --blue:#0047AB;
  --text:#f0f4ff;
  --text2:#a8bcd8;
  --text3:#5a7a9e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}

/* HEADER */
.header{background:linear-gradient(135deg,#003080 0%,#001a4d 100%);border-bottom:2px solid var(--gold);padding:0 12px;height:58px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.header-logo{display:flex;align-items:center;gap:8px;flex:1}
.header-logo svg{flex-shrink:0}
.header-logo-text{display:flex;flex-direction:column;line-height:1}
.header-logo-text .hl-ipuc{font-size:18px;font-weight:900;color:var(--gold);letter-spacing:.08em}
.header-logo-text .hl-sub{font-size:9px;font-weight:600;color:#a8c4f0;letter-spacing:.06em;text-transform:uppercase}
.header-title{font-size:16px;font-weight:700;color:var(--text);flex:1}
.header-btn{background:none;border:none;color:var(--gold);font-size:13px;cursor:pointer;padding:6px 4px;font-weight:600}
.back-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,209,0,.18);border:2px solid rgba(255,209,0,.7);border-radius:50%;cursor:pointer;color:var(--gold);flex-shrink:0;transition:all .15s;font-size:20px;font-weight:700;line-height:1}
.back-btn:active{background:rgba(255,209,0,.35);border-color:var(--gold)}

/* HOME */
.search-wrap{padding:12px 16px 0}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:15px;outline:none}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--gold)}
.tabs{display:flex;gap:0;margin:12px 16px 0;background:var(--bg2);border-radius:10px;padding:3px}
.tab-btn{flex:1;padding:8px;border:none;background:none;color:var(--text2);font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;transition:all .15s}
.tab-btn.active{background:var(--gold);color:#0a1628}
.song-list{padding:8px 16px 100px}
.song-item{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;border:1px solid var(--border);transition:all .15s;display:flex;align-items:center;gap:12px}
.song-item:active{background:var(--bg3)}
.song-info{flex:1;min-width:0}
.song-name{font-size:15px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-key{font-size:12px;color:var(--gold);margin-top:2px;font-weight:600}
.song-arrow{color:#475569;font-size:14px}
.song-star{color:#22c55e;font-size:16px}
.empty-msg{text-align:center;color:#475569;padding:48px 16px;font-size:14px;line-height:1.6}

/* FAB */
.fab{position:fixed;bottom:24px;right:20px;background:var(--gold);border:none;color:#0a1628;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,209,0,.35);z-index:50;font-weight:700}

/* SONG VIEW */
.song-ctrl{background:var(--bg2);padding:10px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:5px}
.ctrl-lbl{font-size:11px;color:var(--text2)}
.cur-key{font-size:16px;font-weight:800;color:var(--gold);min-width:36px;text-align:center}
.ctrl-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ctrl-btn:active{background:var(--gold);color:#0a1628}
.ctrl-btn.sm{width:auto;padding:0 8px;font-size:11px;white-space:nowrap}
.ctrl-sep{width:1px;height:24px;background:var(--border);margin:0 2px}
.add-culto-btn{background:#16a34a;border:none;color:white;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto}
.add-culto-btn.in-list{background:#ef4444}

.song-scroll{padding:16px 16px 20px;overflow-y:auto}
.book{background:#fafaf8;border-radius:12px;padding:20px 18px;border:2px solid #d4b800}
.book-title{font-size:18px;font-weight:800;color:#1a1a2e;margin-bottom:16px;line-height:1.3;font-family:Georgia,serif;letter-spacing:.02em}
.book-key{font-size:12px;font-weight:400;color:#0047AB;display:block;margin-top:4px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0;font-weight:700}
.chord-line{display:flex;flex-wrap:wrap}
.seg{display:inline-flex;flex-direction:column}
.seg-chord{font-family:'Courier New',monospace;font-weight:900;color:#0040a0;white-space:pre;line-height:1.3;padding-right:3px}
.seg-lyric{color:#1a1a2e;white-space:pre;line-height:1.9;font-family:Georgia,serif}
.line-gap{height:10px;width:100%}

/* TRANSPOSE PANEL */
.trans-panel{background:var(--bg2);padding:5px 10px 8px;border-top:1px solid var(--border);position:sticky;bottom:0}
.trans-title{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.06em;margin-bottom:3px}
.notes-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.note-pill{background:var(--bg);border:1.5px solid var(--border);border-radius:6px;padding:4px 5px;font-size:12px;color:var(--text2);cursor:pointer;text-align:center;min-width:34px;font-weight:700;line-height:1.1;transition:all .15s}
.note-pill.active{background:var(--gold);border-color:var(--gold);color:#0a1628;box-shadow:0 0 0 2px rgba(255,209,0,.4);font-size:13px}

/* SET LIST VIEW */
.setlist-wrap{padding:16px 16px 100px}
.setlist-header{font-size:13px;color:var(--text2);margin-bottom:12px}
.setlist-item{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border:1px solid var(--border)}
.setlist-num{width:28px;height:28px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#0a1628;flex-shrink:0}
.setlist-info{flex:1;min-width:0}
.setlist-name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setlist-key{font-size:11px;color:var(--gold);margin-top:2px}
.setlist-del{background:none;border:none;color:#ef4444;font-size:16px;cursor:pointer;padding:4px}
.setlist-open{background:none;border:none;color:var(--gold);font-size:14px;cursor:pointer;padding:4px}
.clear-btn{background:#ef444422;border:1px solid #ef4444;color:#ef4444;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;margin-top:12px}

/* ADD SONG FORM */
.form-wrap{padding:16px 16px 100px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);font-weight:600;letter-spacing:.04em;margin-bottom:6px;display:block}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--gold)}
.form-textarea{font-family:'Courier New',monospace;font-size:13px;min-height:220px;resize:vertical;line-height:1.6}
.form-select option{background:var(--bg2)}
.form-hint{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5;white-space:pre-line}
.form-submit{background:var(--gold);border:none;color:#0a1628;width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer}
.form-submit:active{opacity:.85}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#0a1628;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* SPLASH SCREEN */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#001a4d 0%,#003080 50%,#001040 100%);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;animation:splashIn .7s ease both}
@keyframes splashIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.splash-logo{width:220px;height:auto;filter:drop-shadow(0 0 32px rgba(255,255,255,.25));margin-bottom:16px;object-fit:contain}
.splash-ipuc{font-size:52px;font-weight:900;color:var(--gold);letter-spacing:.12em;line-height:1;text-shadow:0 0 30px rgba(255,209,0,.4)}
.splash-name{font-size:12px;font-weight:600;color:#a8c4f0;letter-spacing:.08em;text-align:center;text-transform:uppercase;margin-top:6px;line-height:1.6}
.splash-divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px 0}
.splash-sub{font-size:16px;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:.1em;text-transform:uppercase}

/* PREMIUM: mejoras globales */
.song-item{box-shadow:0 2px 8px rgba(0,0,0,.3)}
.song-item:hover{border-color:rgba(255,209,0,.3);box-shadow:0 2px 12px rgba(255,209,0,.1)}
.header{backdrop-filter:blur(10px)}
.book{box-shadow:0 4px 20px rgba(0,0,0,.2)}
.ctrl-btn{box-shadow:0 2px 4px rgba(0,0,0,.3)}
.note-pill:hover{border-color:rgba(255,209,0,.5);color:var(--gold)}
</style>
</head>

function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s]/g,'').trim();
}
function getAllSongs() {
  const builtinTitles = new Set(SONGS_BUILTIN.map(s => normalize(s.title)));
  const projector = SONGS_PROJECTOR.filter(s => !builtinTitles.has(normalize(s.title)));
  const user = JSON.parse(localStorage.getItem('c_songs') || '[]');
  return [...SONGS_BUILTIN, ...projector, ...user];
}
function getSetList() { return JSON.parse(localStorage.getItem('c_setlist') || '[]'); }
function saveSetList(arr) { localStorage.setItem('c_setlist', JSON.stringify(arr)); }
function addToSetList(id) { const sl = getSetList(); if (!sl.some(x => String(x) === String(id))) { sl.push(id); saveSetList(sl); } }
function removeFromSetList(id) { saveSetList(getSetList().filter(x => x !== id)); }
function isInSetList(id) { return getSetList().includes(id); }
function addUserSong(song) {
  const arr = JSON.parse(localStorage.getItem('c_songs') || '[]');
  const maxId = Math.max(0, ...getAllSongs().map(s => s.id));
  song.id = maxId + 1;
  arr.push(song);
  localStorage.setItem('c_songs', JSON.stringify(arr));
  return song.id;
}

// ─── DOM HELPER ────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const SVG_TAGS = new Set(['svg','path','polyline','line','rect','circle','g','use','defs','symbol']);
function el(tag, attrs) {
  const e = SVG_TAGS.has(tag) ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (v == null) return;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  for (let i = 2; i < arguments.length; i++) {
    const c = arguments[i];
    if (c == null) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function renderChordLine(line, semi, flat, fontSize) {
  const segs = parseLine(line);
  const hasChord = segs.some(s => s.chord);
  const row = el('div', { class: 'chord-line' });
  segs.forEach(seg => {
    const sp = el('span', { class: 'seg' });
    if (hasChord) {
      const ch = el('span', { class: 'seg-chord' });
      ch.style.fontSize = Math.round(fontSize * 0.84) + 'px';
      ch.textContent = seg.chord ? transposeChord(seg.chord, semi, flat) : ' ';
      sp.appendChild(ch);
    }
    const ly = el('span', { class: 'seg-lyric' });
    ly.style.fontSize = fontSize + 'px';
    ly.textContent = seg.text || (hasChord && seg.chord ? '  ' : '');
    sp.appendChild(ly);
    row.appendChild(sp);
  });
  return row;
}

function renderSong() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const song = getAllSongs().find(s => s.id === state.songId);
  if (!song) { navigate('home'); return; }

  const curKey = getKeyName(song.key, state.semi);
  const flat = FLAT_KEYS.has(curKey);
  const inList = isInSetList(song.id);
  const ORIG_IDX = CHR.indexOf(F2S[song.key] || song.key);
  const semisLabel = state.semi !== 0 ? ' (' + (state.semi > 0 ? '+' : '') + state.semi + ')' : '';

  app.appendChild(el('div', { class: 'header' },
    el('button', { class: 'back-btn', onclick: () => navigate(state.prevScreen || 'home') }, el('svg', {width:'20',height:'20',viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':'2.5','stroke-linecap':'round','stroke-linejoin':'round'}, el('polyline', {points:'15 18 9 12 15 6'}))),
    el('span', { class: 'header-title', style: 'font-size:13px' }, song.title)
  ));

  const ctrl = el('div', { class: 'song-ctrl' },
    el('div', { class: 'ctrl-group' },
      el('span', { class: 'ctrl-lbl' }, 'Tono:'),
      el('button', { class: 'ctrl-btn', onclick: () => { state.semi--; renderSong(); } }, '−'),
      el('span', { class: 'cur-key' }, curKey + semisLabel),
      el('button', { class: 'ctrl-btn', onclick: () => { state.semi++; renderSong(); } }, '+')
    ),
    state.semi !== 0 ? el('button', { class: 'ctrl-btn sm', onclick: () => { state.semi = 0; renderSong(); }, style: 'margin-left:2px' }, '↺ Orig') : null,
    el('div', { class: 'ctrl-sep' }),
    el('div', { class: 'ctrl-group' },
      el('span', { class: 'ctrl-lbl' }, 'Letra:'),
      el('button', { class: 'ctrl-btn sm', onclick: () => { state.fontSize = Math.max(13, state.fontSize - 2); renderSong(); } }, 'A−'),
      el('button', { class: 'ctrl-btn sm', onclick: () => { state.fontSize = Math.min(26, state.fontSize + 2); renderSong(); } }, 'A+')
    ),
    el('button', {
      class: 'add-culto-btn' + (inList ? ' in-list' : ''),
      onclick: () => {
        if (inList) removeFromSetList(song.id); else addToSetList(song.id);
        showToast(inList ? 'Quitado del culto' : '★ Agregado al culto');
        renderSong();
      }
    }, inList ? '× Quitar' : '+ Agregar al culto')
  );
  app.appendChild(ctrl);

  const book = el('div', { class: 'book' });
  const displayKey = flat ? (S2F[curKey] || curKey) : curKey;
  const espKey = ESP[displayKey] || displayKey;
  const titleEl = el('div', { class: 'book-title' }, song.title.toUpperCase());
  titleEl.appendChild(el('span', { class: 'book-key' }, 'Tonalidad: ' + curKey + '  (' + espKey + ')'));
  book.appendChild(titleEl);
  song.content.split('\n').forEach(line => {
    if (line.trim() === '') book.appendChild(el('div', { class: 'line-gap' }));
    else book.appendChild(renderChordLine(line, state.semi, flat, state.fontSize));
  });

  app.appendChild(el('div', { class: 'song-scroll' }, book));

  // Transpose panel
  const activeIdx = ((ORIG_IDX + state.semi) % 12 + 12) % 12;
  const trans = el('div', { class: 'trans-panel' },
    el('div', { class: 'trans-title' }, 'TOCA EN OTRO TONO')
  );

  function makeRow(notes) {
    const row = el('div', { class: 'notes-row' });
    notes.forEach(note => {
      const idx = CHR.indexOf(note);
      const isActive = idx === activeIdx;
      const displayNote = flat && S2F[note] ? S2F[note] : note;
      const pill = el('div', { class: 'note-pill' + (isActive ? ' active' : ''), onclick: () => {
        const diff = ((idx - ORIG_IDX) + 12) % 12;
        state.semi = diff <= 6 ? diff : diff - 12;
        renderSong();
      }});
      pill.textContent = (isActive ? '✓ ' : '') + (ESP[displayNote] || displayNote);
      row.appendChild(pill);
    });
    return row;
  }

  trans.appendChild(makeRow(['C','D','E','F','G','A','B']));
  trans.appendChild(makeRow(['C#','D#','F#','G#','A#']));
  app.appendChild(trans);
}

    const key = keySel.value;
    const content = contentTA.value.trim();
    if (!title) { alert('Escribe el nombre de la canción'); return; }
    if (!content) { alert('Escribe la letra con acordes'); return; }
    const id = addUserSong({ title, key, content });
    showToast('Canción guardada ✓');
    state.songId = id; state.semi = 0;
    navigate('song');
  }}, 'Guardar canción'));

  app.appendChild(form);
}

// ─── NAV & TOAST ───────────────────────────────────────────────
function navigate(screen) { state.screen = screen; window.scrollTo(0, 0); render(); }

function render() {
  if (state.screen === 'home') renderHome();
  else if (state.screen === 'song') renderSong();
  else if (state.screen === 'setlist') renderSetList();
  else if (state.screen === 'add') renderAdd();
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

render();

// Splash screen
(function(){
  var sp = document.getElementById('splash');
  if(!sp) return;
  setTimeout(function(){ sp.classList.add('hide'); }, 2500);
})();
</script>
</body>
</html>
